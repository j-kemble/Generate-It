[build-system]
requires = ["setuptools>=68", "wheel", "build>=1.0.0"]
build-backend = "setuptools.build_meta"

# Reproducible builds configuration
# Users can verify the build is reproducible with:
#   SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) python -m build
[project]
name = "generate-it"
version = "0.2.2"
description = "Terminal credential generator with a curses-based TUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "windows-curses; platform_system == 'Windows'",
  "platformdirs>=4.0",
  "cryptography>=42.0.0",
  "pyperclip>=1.8.0",
]
license = { file = "LICENSE" }
authors = [{ name = "j-kemble" }]
keywords = ["password", "passphrase", "username", "curses"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
]

[project.optional-dependencies]
# Development and test dependencies (not required to run the app).
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "bandit[toml]>=1.7.0",
  "pip-audit>=2.10.0",
  "mypy>=1.8.0",
  "pre-commit>=3.5.0",
]
test = ["pytest>=8.0"]

[project.scripts]
generate-it = "generate_it.__main__:main"

[project.urls]
Homepage = "https://github.com/j-kemble/Generate-It"
Repository = "https://github.com/j-kemble/Generate-It"
Issues = "https://github.com/j-kemble/Generate-It/issues"

[tool.setuptools]
packages = ["generate_it"]

[tool.setuptools.package-data]
generate_it = ["wordlist.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# Bandit security linter configuration
exclude_dirs = ["tests"]
skips = []

[tool.mypy]
# Static type checker configuration
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# Relaxed settings for gradual adoption
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

[tool.pip-audit]
# Vulnerability scanner configuration
requirement_files = []
local = false
vulnerability_service = "pyup"
